name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Test combat rules
        run: ./tools/run-core-tests.sh

      - name: Build Fabric and NeoForge jars
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      # Keeps the latest build log on the ci-logs branch so it can be read without a GitHub login.
      - name: Save build log
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs && cd /tmp/ci-logs
          git init -q -b ci-logs
          cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || echo "no build log" > build.log
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Build log for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload jars
        uses: actions/upload-artifact@v5
        with:
          name: crossblades-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar

      # Publishes a GitHub release the first time a new version (gradle.properties) reaches main.
      - name: Check for a new version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.release.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Crossblades ${{ steps.release.outputs.version }}
          body: |
            Directional, skill-based melee combat for Minecraft 26.1.2.

            Download the jar for your loader (Fabric or NeoForge) and also install
            [Player Animation Library](https://modrinth.com/mod/player-animation-library) for 26.1.x.
            Fabric also needs Fabric API. See the README for controls and settings.
          files: |
            fabric/build/libs/crossblades-fabric-*[0-9].jar
            neoforge/build/libs/crossblades-neoforge-*[0-9].jar

  # Launches the real game (headless) with the built mod and Player Animation Library, joins a
  # singleplayer world and quits. Catches crashes on startup and world join.
  runtime-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v5
        with:
          name: crossblades-jars
          path: jars

      - name: Stage mods
        shell: bash
        run: |
          mkdir -p run/mods run/config
          touch run/config/crossblades-selftest
          cp jars/${{ matrix.loader }}/build/libs/crossblades-${{ matrix.loader }}-*[0-9].jar run/mods/
          url=$(curl -fsSL 'https://api.modrinth.com/v2/project/player-animation-library/version?game_versions=%5B%2226.1.2%22%5D' \
            | jq -r '[.[] | select(.loaders | index("${{ matrix.loader }}"))][0].files[] | select(.primary) | .url')
          echo "Player Animation Library: $url"
          curl -fsSL -o run/mods/player-animation-library.jar "$url"
          ls -l run/mods

      - name: Run the game
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: 26.1.2
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          mc-runtime-test: ${{ matrix.loader }}
          java: 25
          fabric-api: ${{ matrix.loader == 'fabric' && '0.155.3' || 'none' }}

      - name: Check the in-game self-test passed
        shell: bash
        run: |
          grep "\[self-test\]" run/logs/latest.log || true
          grep -q "\[self-test\] PASSED" run/logs/latest.log

      - name: Save game log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs && cd /tmp/ci-logs
          git init -q -b ci-logs-${{ matrix.loader }}
          cp "$GITHUB_WORKSPACE/run/logs/latest.log" game.log 2>/dev/null || echo "no game log" > game.log
          ls "$GITHUB_WORKSPACE/run/crash-reports" >/dev/null 2>&1 && cp "$GITHUB_WORKSPACE"/run/crash-reports/* . || true
          cp "$GITHUB_WORKSPACE"/run/screenshots/*.png . 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Game log for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-${{ matrix.loader }}

  # Starts a real dedicated server with the mod, waits for it to finish loading, then stops it.
  # Catches client-only code being loaded on servers.
  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v5
        with:
          name: crossblades-jars
          path: jars

      - name: Set up server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/mods && cd server
          echo "eula=true" > eula.txt
          cp ../jars/${{ matrix.loader }}/build/libs/crossblades-${{ matrix.loader }}-*[0-9].jar mods/
          modrinth() {
            curl -fsSL "https://api.modrinth.com/v2/project/$1/version?game_versions=%5B%2226.1.2%22%5D&loaders=%5B%22$2%22%5D" \
              | jq -r '.[0].files[] | select(.primary) | .url'
          }
          if [ "${{ matrix.loader }}" = fabric ]; then
            loader=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader/26.1.2 | jq -r '.[0].loader.version')
            installer=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')
            curl -fsSL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/26.1.2/$loader/$installer/server/jar"
            curl -fsSL -o mods/fabric-api.jar "$(modrinth fabric-api fabric)"
            # Required on Fabric servers too.
            curl -fsSL -o mods/player-animation-library.jar "$(modrinth player-animation-library fabric)"
          else
            version=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
              | grep -o '<version>26\.1\.2\.[^<]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
            echo "NeoForge $version"
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$version/neoforge-$version-installer.jar"
            java -jar installer.jar --install-server . > installer.log 2>&1
            # Player Animation Library is only needed on NeoForge clients, so leave it out here.
          fi
          ls mods

      - name: Run server
        shell: bash
        run: |
          cd server
          if [ -f run.sh ]; then start="bash run.sh nogui"; else start="java -Xmx2G -jar server.jar nogui"; fi
          ( for i in $(seq 1 300); do sleep 1; grep -q "Done (" logs/latest.log 2>/dev/null && break; done; sleep 5; echo stop ) \
            | timeout 400 $start > console.log 2>&1 || true
          grep "Crossblades loaded" logs/latest.log
          grep -q "Done (" logs/latest.log
          ! ls crash-reports/* 2>/dev/null

      - name: Save server log
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs && cd /tmp/ci-logs
          git init -q -b ci-logs-server-${{ matrix.loader }}
          cp "$GITHUB_WORKSPACE/server/logs/latest.log" server.log 2>/dev/null || cp "$GITHUB_WORKSPACE/server/console.log" server.log 2>/dev/null || echo "no log" > server.log
          cp "$GITHUB_WORKSPACE"/server/crash-reports/* . 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Server log for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-server-${{ matrix.loader }}
