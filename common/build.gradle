plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Animations. Only used by client code; each loader adds its own build of the library.
    compileOnly("com.zigythebird.playeranim:PlayerAnimationLibCommon:${pal_version}") { transitive = false }
    // Player Animation Library's own dependencies are left out on purpose: Minecraft already
    // ships them, and the library's newer version numbers clash with Minecraft's pinned ones.
    compileOnly("com.zigythebird.playeranim:PlayerAnimationLibCore:${pal_version}") { transitive = false }
    compileOnly("com.zigythebird:mochafloats:${pal_molang_version}") { transitive = false }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

// The rule tests in src/test are plain Java programs run by tools/run-core-tests.sh (CI runs it),
// not JUnit tests, so Gradle's test task finds nothing to run.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}
